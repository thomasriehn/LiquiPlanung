services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-liqui}
      POSTGRES_USER: ${POSTGRES_USER:-liqui}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-liqui} -d ${POSTGRES_DB:-liqui}"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-liqui}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-liqui}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY in .env setzen}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD in .env setzen}
      DEMO_DATEN: ${DEMO_DATEN:-true}
      BACKUP_VERZEICHNIS: /srv/liquiplanung/backups
      BACKUP_INTERVALL_STUNDEN: ${BACKUP_INTERVALL_STUNDEN:-24}
      BACKUP_AUFBEWAHRUNG_TAGE: ${BACKUP_AUFBEWAHRUNG_TAGE:-30}
      ABLAGE_VERZEICHNIS: /srv/liquiplanung/ablage
      ABLAGE_MAX_MB: ${ABLAGE_MAX_MB:-25}
      GEHEIMNIS_SCHLUESSEL: ${GEHEIMNIS_SCHLUESSEL:-}
      GRAPH_CLIENT_SECRET: ${GRAPH_CLIENT_SECRET:-}
      LLM_URL: ${LLM_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
    volumes:
      - backups:/srv/liquiplanung/backups
      - ${ABLAGE_HOST_PFAD:-ablage}:/srv/liquiplanung/ablage
    ports:
      - "${APP_PORT:-8000}:8000"

volumes:
  pgdata:
  backups:
  ablage:
