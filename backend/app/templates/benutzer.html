{% extends "base.html" %}
{% block titel %}Benutzer – LiquiPlanung{% endblock %}
{% block inhalt %}
<div class="seite">
  <h1>Benutzerverwaltung</h1>
  <form id="neu-form" class="formular-zeilen">
    <label>E-Mail<input type="email" name="email" required></label>
    <label>Name<input name="name" required></label>
    <label>Passwort<input type="password" name="passwort" required minlength="8"></label>
    <label>Rolle
      <select name="rolle">
        <option value="BEARBEITER">Bearbeiter</option>
        <option value="LESER">Leser</option>
        <option value="ADMIN">Admin</option>
      </select>
    </label>
    <label>Mandanten (Mehrfachauswahl; Admin sieht immer alle)
      <select name="mandanten_ids" multiple size="4">
        {% for m in mandanten %}<option value="{{ m.id }}">{{ m.name }}</option>{% endfor %}
      </select>
    </label>
    <button type="submit">Anlegen</button>
  </form>
  <div style="height:10px"></div>
  <table class="liste">
    <thead><tr><th>E-Mail</th><th>Name</th><th>Rolle</th><th>Mandanten</th><th>aktiv</th><th></th></tr></thead>
    <tbody id="tabelle"></tbody>
  </table>
</div>
{% endblock %}
{% block skripte %}
<script>
const MANDANTEN = { {% for m in mandanten %}"{{ m.id }}": "{{ m.name }}",{% endfor %} };

async function lade() {
  const benutzer = await api("GET", "/api/benutzer");
  const tb = document.getElementById("tabelle");
  tb.innerHTML = "";
  for (const b of benutzer) {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${esc(b.email)}</td><td>${esc(b.name)}</td><td>${esc(b.rolle)}</td>
      <td class="klein">${b.rolle === "ADMIN" ? "alle" : esc(b.mandanten_ids.map(id => MANDANTEN[id] || id).join(", ")) || "–"}</td>
      <td>${b.aktiv ? "✓" : "–"}</td>
      <td><button class="sekundaer" data-id="${b.id}" data-aktiv="${b.aktiv}">${b.aktiv ? "sperren" : "entsperren"}</button></td>`;
    tb.appendChild(tr);
  }
  tb.querySelectorAll("button").forEach(btn => btn.addEventListener("click", async () => {
    try { await api("PATCH", `/api/benutzer/${btn.dataset.id}`, { aktiv: btn.dataset.aktiv !== "true" }); lade(); }
    catch (e) { toast(e.message); }
  }));
}

document.getElementById("neu-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  const daten = {
    email: f.get("email"), name: f.get("name"), passwort: f.get("passwort"),
    rolle: f.get("rolle"),
    mandanten_ids: [...e.target.querySelector("[name=mandanten_ids]").selectedOptions].map(o => parseInt(o.value)),
  };
  try { await api("POST", "/api/benutzer", daten); e.target.reset(); lade(); }
  catch (err) { toast(err.message); }
});
lade();
</script>
{% endblock %}
