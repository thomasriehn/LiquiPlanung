{% extends "base.html" %}
{% block titel %}Anmelden – LiquiPlanung{% endblock %}
{% block inhalt %}
<div class="login-box">
  <h1>Anmelden</h1>
  {% if fehler %}<p class="fehler">{{ fehler }}</p>{% endif %}
  <form method="post" action="/login">
    <label>E-Mail<input type="email" name="email" required autofocus></label>
    <label>Passwort<input type="password" name="passwort" required></label>
    <button type="submit">Anmelden</button>
  </form>
</div>
{% endblock %}
